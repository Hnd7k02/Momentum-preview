<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the app reach under the notch and the
         home indicator; the safe-area insets in tokens.css put the content
         back where it belongs.

         Zoom is deliberately not blocked. `user-scalable=no` is honoured by
         Android Chrome and takes pinch-to-zoom away from anyone who needs it,
         which is a straight accessibility failure; the layout already holds
         at 200% text, so there was nothing to protect. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f8" />
    <meta name="description" content="Sieh, wohin dein Leben steuert." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, as in `Momentum-App` and as decided at STOP 6b for the
         rest of WP3 (D149, D163): the status bar is painted from
         `theme-color`, which the app sets per world — light in Mind, dark in
         Gym.

         Up to and including the Stage 4 publish this preview carried
         `black-translucent`, the only style under which the web view reaches
         the physical top edge and `env(safe-area-inset-top)` becomes a real
         value. An edge-to-edge status bar is a backlog item of its own: with
         `black-translucent` the bar's own text is always white for a Home
         Screen app, so the light Mind world would need a dark gradient at
         the top. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Momentum" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and uses this one. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Momentum</title>
    <script type="module" crossorigin src="/Momentum-preview/assets/index-CDM1MG5m.js"></script>
    <link rel="stylesheet" crossorigin href="/Momentum-preview/assets/index-YFby2TZR.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
